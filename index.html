<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SECOND CHANCE TYCOON</title>
<style>
html,body{margin:0;min-height:100%;background:#1d2b3a;color:#fff;font:17px/1.4 Arial,Helvetica,sans-serif}
body{padding:16px}
</style>
</head>
<body>
<p>SECOND CHANCE TYCOON wird geladen …</p>
<script>
(async()=>{
  try{
    const url='https://raw.githubusercontent.com/cnstii/neu4/83bb4ee6d064cf2c7c05449352b20531c67a450e/second-chance-tycoon%204.html';
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    let h=await response.text();
    h=h.replace(/<link href="https:\/\/fonts.googleapis.com\/css2\?family=Pixelify[^>]*>\s*/,'');
    h=h.replace(/font-family:'Pixelify Sans',ui-monospace,monospace/g,'font-family:Arial,Helvetica,sans-serif');
    const oldTxt=h.match(/function txt\(s,x,y,c,sz,al\)\{[^}]*\}/);
    if(!oldTxt)throw new Error('Textdarstellung im Spiel nicht gefunden');
    const newTxt="function txt(s,x,y,c,sz,al){ctx.font='bold '+Math.max(sz||8,10)+'px Arial,Helvetica,sans-serif';ctx.textAlign=al||'center';ctx.lineJoin='round';ctx.lineWidth=3;ctx.strokeStyle='#0b1220';ctx.strokeText(s,Math.round(x),Math.round(y));ctx.fillStyle=c||'#fff';ctx.fillText(s,Math.round(x),Math.round(y));}";
    h=h.replace(oldTxt[0],newTxt);
    h=h.replace("txt(s.n.length>12?s.n.slice(0,11)+'…':s.n,sx,sy-24,'#fff',7);","txt(s.n.length>14?s.n.slice(0,13)+'…':s.n,sx,sy-26,'#fff',10);");
    const readableCss=`
body,button,textarea{font-family:Arial,Helvetica,sans-serif!important}
button{font-size:17px;font-weight:700}
.chip{font-size:17px;font-weight:700;background:rgba(8,14,26,.92)}
#money{font-size:21px}
#hint{font-size:17px;font-weight:700;line-height:1.3;background:rgba(8,14,26,.9);max-width:64vw;padding:6px 12px}
#toast{font-size:18px;font-weight:700;line-height:1.3}
#act{font-size:16px;font-weight:700}
#bar button{font-size:13px;font-weight:700;min-width:70px}
#ph{font-size:21px}
#pb{font-size:17px;line-height:1.45}
.row{padding:8px 0}
.row .nm{font-weight:700}
.row small,.rc small{opacity:1;color:#cfdcf0;font-size:14px;font-weight:400;line-height:1.35}
.rc{font-size:16px}
.sec{font-size:18px;margin:12px 0 4px}
#pb small{font-size:14px;color:#cfdcf0;line-height:1.4}
textarea{font-size:14px}
#rot{font-size:24px;font-weight:700}
@media (max-height:420px){.chip{font-size:15px;padding:3px 7px}#money{font-size:17px}#hint{font-size:15px;top:44px}button{font-size:15px;min-height:36px}#toast{font-size:16px}#pb{font-size:16px}.row small,#pb small{font-size:13px}}
`;
    h=h.replace('</style>',readableCss+'</style>');
    if(!h.includes('Math.max(sz||8,10)')||!h.includes('font-size:17px;font-weight:700'))throw new Error('Lesbarkeitsverbesserungen konnten nicht gesetzt werden');
    document.open();document.write(h);document.close();
  }catch(e){document.body.innerHTML='<p style="padding:1em;color:#fff;font:600 18px Arial,sans-serif">Laden fehlgeschlagen. Bitte erneut versuchen. ('+e.message+')</p>';}
})();
</script>
</body>
</html>
